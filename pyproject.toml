[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-integrator-duckdb"
version = "0.1.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "DuckDB for Liminal: each feed's closed months of bars as an instance of their own, with new DuckDB files and files elsewhere beside it."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the database kind and its instances: liminal_libs.storage.databases, plugin API 2.3, 1.61.0)
dependencies = ["liminal-libs>=1.61.0", "duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
duckdb = "plugin_integrator_duckdb"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
